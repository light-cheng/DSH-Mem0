name: release

# Publishing a GitHub release publishes the package to npm through npm
# trusted publishing (OIDC). No npm token or secret is used; the trusted
# publisher on npmjs.com names this file (release.yml) with no environment.
on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # registry-url makes setup-node write an .npmrc with
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. That does not
      # get in the way of OIDC: npm tries trusted publishing first and falls
      # back to a token only when no OIDC token is available ("The npm CLI
      # automatically detects OIDC environments and uses them for
      # authentication before falling back to traditional tokens",
      # docs.npmjs.com/trusted-publishers), and npm's own example workflow
      # uses registry-url the same way. NODE_AUTH_TOKEN is deliberately not
      # set anywhere in this workflow.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caching in release builds (npm docs)
      # Trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm >= 11.5.1
        run: |
          npm --version
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
            npm --version
          fi
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "release tag: $TAG, package.json version: $VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
      # The repository has pnpm-lock.yaml and no package-lock.json, so
      # `npm ci` cannot run here; install exactly as ci.yml does.
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: npm test
      - run: npm run check
      # No --provenance: with trusted publishing npm generates provenance
      # "by default—you don't need to add the --provenance flag"
      # (docs.npmjs.com/trusted-publishers, "Automatic provenance
      # generation"; also docs.npmjs.com/generating-provenance-statements).
      # A pre-release goes to the `next` dist-tag so `latest` stays on the
      # last stable version. No `npm dist-tag` call: the trusted publisher
      # allows npm publish only.
      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi
