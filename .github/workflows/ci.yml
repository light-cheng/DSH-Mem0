name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node --version
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: npm run check
      # node:sqlite tests are never skipped: a platform without it fails here.
      - run: npm test
      # The local store end to end in a temporary HOME: open, write, search,
      # a second connection's write seen through data_version, reopen.
      - run: node scripts/smoke-store.mjs
      - run: npm pack --dry-run

  # One check named `test` for the main branch ruleset, which cannot match
  # the matrix job names (`test (ubuntu-latest)`, …). Fails unless every
  # platform succeeded; runs even when one of them failed or was cancelled.
  test-summary:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All platforms passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "matrix result: $RESULT"
          test "$RESULT" = success
